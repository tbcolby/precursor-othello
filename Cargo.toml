[package]
name = "othello"
version = "0.1.0"
authors = ["Tyler Colby"]
edition = "2021"
description = "Othello with a bounded, cancellable AI opponent for Precursor"
license = "Apache-2.0"

# Lives at xous-core/apps/othello/ (see xous-dev-toolkit/bin/integrate).
# The game engine is libs/othello-core in this repo; integrate copies it to xous-core/libs/.
[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.71"
log-server = { package = "xous-api-log", version = "0.1.70" }
xous-names = { package = "xous-api-names", version = "0.9.72" }
gam = { path = "../../services/gam" }
precursor-appkit = { path = "../../libs/precursor-appkit" }
othello-core = { path = "../../libs/othello-core" }

[features]
default = []
